name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Let CI fetch locked dependencies; local runs default to offline.
  CARGO_NET: ""
  NPM_NET: ""
  RUFF: ruff
  FORCE_COLOR: "1"

jobs:
  python-lint:
    name: Python · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install "ruff==$(make -s print-ruff-version)"
      - run: make py-lint

  python-test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Integration example
        run: python integration/run.py

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: implementations/go/go.mod
          cache: false
      - run: make go-lint go-test go-build

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - if: matrix.toolchain == 'stable'
        run: make rust-lint
      - run: make rust-test rust-build

  typescript:
    name: TypeScript · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "lts/*"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: implementations/javascript/package-lock.json
      - run: make ts-lint ts-test

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"
      - run: make dotnet-lint dotnet-test

  docs:
    name: Docs and schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: make docs

  matrix:
    name: Cross-client matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v6
        with:
          go-version-file: implementations/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementations/javascript/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"
      - run: make matrix
      - name: Upload matrix logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: client-matrix-logs
          path: integration/.runs/
          include-hidden-files: true
          retention-days: 7

  ci-passed:
    name: CI passed
    if: always()
    needs: [python-lint, python-test, go, rust, typescript, dotnet, docs, matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
